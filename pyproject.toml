[tool.pytest.ini_options]
# run pytest from the repo root and `from src.orderbook.order import Order`
# resolves. without this, pytest puts the tests/ directory on sys.path and
# not the repo root, so src/ is invisible.
pythonpath = ["."]
testpaths = ["tests"]

# `slow` must be registered or pytest warns on the marker. addopts excludes it
# by default, so `pytest` is the fast suite and `pytest -m slow` is the 2M run.
markers = ["slow: long-running fuzz; run with -m slow"]
addopts = "-m 'not slow'"
